services:
  db:
    image: postgres:16-alpine
    container_name: rfp-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rfp_assistant
      POSTGRES_USER: rfp_user
      POSTGRES_PASSWORD: rfp_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rfp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp_user -d rfp_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rfp-assistant-redis
    restart: unless-stopped
    # Enable AOF persistence so task queue survives Redis restarts.
    # appendonly yes: every write is logged to disk
    # appendfsync everysec: fsync once per second (good balance of safety vs perf)
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rfp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfp-assistant-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://rfp_user:rfp_secret_password@db:5432/rfp_assistant
      - SECRET_KEY=change-this-to-a-very-long-random-secret-key-in-production
      - ADMIN_EMAIL=admin@rfp-assistant.fr
      - ADMIN_PASSWORD=admin123
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:4200
      - UPLOAD_DIR=/app/data/uploads
      - EXPORT_DIR=/app/data/exports
      - IMAGES_DIR=/app/data/images
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/data/huggingface
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Ollama on the Mac host — GPU-accelerated via Metal
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_NER_MODEL=${OLLAMA_NER_MODEL:-gemma3:4b}
      - OLLAMA_NER_TIMEOUT=60
      - OLLAMA_NER_CONCURRENCY=3
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rfp-network
    # Allow containers to reach the Docker host (for Ollama on Mac)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker for document processing (heavy tasks: NER, embedding, indexing)
  celery-worker-documents:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfp-assistant-celery-documents
    restart: unless-stopped
    # Listen on the 'documents' queue with 2 concurrent workers.
    # This allows processing 2 documents in parallel.
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 --queues=documents --hostname=documents@%h
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://rfp_user:rfp_secret_password@db:5432/rfp_assistant
      - SECRET_KEY=change-this-to-a-very-long-random-secret-key-in-production
      - UPLOAD_DIR=/app/data/uploads
      - EXPORT_DIR=/app/data/exports
      - IMAGES_DIR=/app/data/images
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/data/huggingface
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_NER_MODEL=${OLLAMA_NER_MODEL:-gemma3:4b}
      - OLLAMA_NER_TIMEOUT=60
      - OLLAMA_NER_CONCURRENCY=3
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rfp-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Worker for default tasks (AI generation, exports, analysis)
  celery-worker-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfp-assistant-celery-default
    restart: unless-stopped
    # Listen on the 'default' queue with 2 concurrent workers.
    # These tasks are mostly I/O-bound (API calls to Mistral).
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 --queues=default --hostname=default@%h
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://rfp_user:rfp_secret_password@db:5432/rfp_assistant
      - SECRET_KEY=change-this-to-a-very-long-random-secret-key-in-production
      - UPLOAD_DIR=/app/data/uploads
      - EXPORT_DIR=/app/data/exports
      - IMAGES_DIR=/app/data/images
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/data/huggingface
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_NER_MODEL=${OLLAMA_NER_MODEL:-gemma3:4b}
      - OLLAMA_NER_TIMEOUT=60
      - OLLAMA_NER_CONCURRENCY=3
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rfp-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rfp-assistant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rfp-network

volumes:
  postgres_data:
  backend_data:
  redis_data:

networks:
  rfp-network:
    driver: bridge
