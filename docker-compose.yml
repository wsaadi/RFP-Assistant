# Shared Celery worker configuration (beta: 2 workers for parallel processing)
x-celery-worker: &celery-worker
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &celery-env
    - PYTHONUNBUFFERED=1
    - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    - SECRET_KEY=${SECRET_KEY}
    - UPLOAD_DIR=/app/data/uploads
    - EXPORT_DIR=/app/data/exports
    - IMAGES_DIR=/app/data/images
    - CHROMA_PERSIST_DIR=/app/data/chroma
    - HF_TOKEN=${HF_TOKEN:-}
    - HF_HOME=/app/data/huggingface
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    - OLLAMA_NER_MODEL=${OLLAMA_NER_MODEL:-qwen2.5:14b}
    - OLLAMA_NER_TIMEOUT=120
    - OLLAMA_NER_CONCURRENCY=2
  volumes:
    - backend_data:/app/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - rfp-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  deploy:
    resources:
      limits:
        memory: 4G

services:
  db:
    image: postgres:16-alpine
    container_name: rfp-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Security: DB only accessible from internal network, not from host
    # Uncomment the line below ONLY for local development/debugging
    # ports:
    #   - "127.0.0.1:5432:5432"
    networks:
      - rfp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: rfp-assistant-redis
    restart: unless-stopped
    # AOF persistence + authentication + bounded memory
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 384mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --rename-command DEBUG ""
    # Security: Redis only accessible from internal network
    # Uncomment the line below ONLY for local development/debugging
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rfp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfp-assistant-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rfp-assistant.fr}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4200}
      - UPLOAD_DIR=/app/data/uploads
      - EXPORT_DIR=/app/data/exports
      - IMAGES_DIR=/app/data/images
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/data/huggingface
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_NER_MODEL=${OLLAMA_NER_MODEL:-qwen2.5:14b}
      - OLLAMA_NER_TIMEOUT=120
      - OLLAMA_NER_CONCURRENCY=2
      - DEBUG=${DEBUG:-false}
    volumes:
      - backend_data:/app/data
    # Security: backend only accessible via nginx, not directly from host
    # Uncomment the line below ONLY for local development/debugging
    # ports:
    #   - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rfp-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "dgx-spark:192.168.10.170"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 5G

  # ── Celery Workers ──
  # Three dedicated workers split by workload profile:
  #
  # 1. documents (concurrency=5): CPU-bound processing (NER, embedding, images)
  #    AND vector search.  This is the ONLY worker that loads the ~800MB
  #    embedding model.  AI workers delegate searches here via tasks.vector_search.
  #
  # 2. default (concurrency=4): Lightweight tasks (Word/PDF export, backups).
  #    No embedding model loaded — saves ~3.2GB RAM.
  #
  # 3-4. ai ×2 (concurrency=6 each = 12 total): I/O-bound LLM calls.
  #    No embedding model loaded — saves ~9.6GB RAM.  Vector searches are
  #    delegated to the documents worker via tasks.vector_search.
  #
  # max-memory-per-child=2000000: ~2GB — must exceed embedding model (~800MB)
  #   plus processing overhead.
  # max-tasks-per-child=50: periodic recycling for clean state.

  # Worker 1: Document processing + vector search (owns the embedding model)
  # Concurrency=5: handles both long-running document processing AND fast
  # vector_search requests from AI workers.  All five child processes load
  # the ~800MB model (~4GB total), which is far cheaper than loading it in
  # every AI worker process (~9.6GB).
  celery-worker-documents:
    <<: *celery-worker
    container_name: rfp-assistant-celery-worker-documents
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=5
      --queues=documents
      --max-memory-per-child=2000000
      --max-tasks-per-child=50
      --without-heartbeat
      --hostname=worker-documents@%h
    deploy:
      resources:
        limits:
          memory: 6G

  # Worker 2: Lightweight tasks (exports, backups)
  # Concurrency=4 so 10 concurrent users can export in parallel.
  # Note: embedding model preload is skipped for this worker (see celery_app.py)
  # since exports/backups never use embeddings. Saves ~3.2GB RAM.
  celery-worker-default:
    <<: *celery-worker
    container_name: rfp-assistant-celery-worker-default
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default
      --max-memory-per-child=2000000
      --max-tasks-per-child=50
      --without-heartbeat
      --hostname=worker-default@%h

  # Workers 3-4: AI/LLM tasks (I/O-bound, external API calls)
  # Two workers with concurrency=6 each = 12 total concurrent AI slots.
  # Tasks are network-bound (waiting on LLM responses), not CPU-bound.
  # Splitting across two workers distributes CPU and avoids single-process
  # bottlenecks. With 12 slots, 10 users can run AI tasks with minimal queuing.
  celery-worker-ai-1:
    <<: *celery-worker
    container_name: rfp-assistant-celery-worker-ai-1
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=6
      --queues=ai
      --max-memory-per-child=2000000
      --max-tasks-per-child=50
      --without-heartbeat
      --hostname=worker-ai-1@%h
    deploy:
      resources:
        limits:
          memory: 6G

  celery-worker-ai-2:
    <<: *celery-worker
    container_name: rfp-assistant-celery-worker-ai-2
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=6
      --queues=ai
      --max-memory-per-child=2000000
      --max-tasks-per-child=50
      --without-heartbeat
      --hostname=worker-ai-2@%h
    deploy:
      resources:
        limits:
          memory: 6G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rfp-assistant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rfp-network
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  backend_data:
  redis_data:

networks:
  rfp-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
