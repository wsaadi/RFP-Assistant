services:
  db:
    image: postgres:16-alpine
    container_name: rfp-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rfp_assistant
      POSTGRES_USER: rfp_user
      POSTGRES_PASSWORD: rfp_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rfp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp_user -d rfp_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: rfp-assistant-redis
    restart: unless-stopped
    # AOF persistence: task queue survives Redis restarts
    # maxmemory 256mb: bounded memory usage for progress/exports
    # noeviction: never silently drop task messages
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rfp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfp-assistant-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://rfp_user:rfp_secret_password@db:5432/rfp_assistant
      - SECRET_KEY=change-this-to-a-very-long-random-secret-key-in-production
      - ADMIN_EMAIL=admin@rfp-assistant.fr
      - ADMIN_PASSWORD=admin123
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:4200
      - UPLOAD_DIR=/app/data/uploads
      - EXPORT_DIR=/app/data/exports
      - IMAGES_DIR=/app/data/images
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/data/huggingface
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Ollama on DGX Spark — routed via Mac host (Docker bridge can't reach LAN directly)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_NER_MODEL=${OLLAMA_NER_MODEL:-qwen2.5:14b}
      - OLLAMA_NER_TIMEOUT=120
      - OLLAMA_NER_CONCURRENCY=2
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rfp-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "dgx-spark:192.168.10.170"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  # Single worker handling both queues (documents + default).
  # concurrency=2: allows 2 tasks in parallel (e.g. 1 document + 1 AI generation)
  # max-memory-per-child=500000: auto-restarts child workers that grow beyond ~500MB
  #   (prevents memory leaks from accumulating across many tasks)
  # max-tasks-per-child=20: periodically recycles workers for a clean state
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfp-assistant-celery-worker
    restart: unless-stopped
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=documents,default
      --max-memory-per-child=500000
      --max-tasks-per-child=20
      --without-heartbeat
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://rfp_user:rfp_secret_password@db:5432/rfp_assistant
      - SECRET_KEY=change-this-to-a-very-long-random-secret-key-in-production
      - UPLOAD_DIR=/app/data/uploads
      - EXPORT_DIR=/app/data/exports
      - IMAGES_DIR=/app/data/images
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/data/huggingface
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_NER_MODEL=${OLLAMA_NER_MODEL:-qwen2.5:14b}
      - OLLAMA_NER_TIMEOUT=120
      - OLLAMA_NER_CONCURRENCY=2
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rfp-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 3G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rfp-assistant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rfp-network
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  backend_data:
  redis_data:

networks:
  rfp-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
